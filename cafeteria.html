<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería & Nutrición · Black Diamond Gym</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --red:    #e31c25;
            --red2:   #c0111a;
            --black:  #080808;
            --dark:   #0f0f0f;
            --card:   #141414;
            --card2:  #1a1a1a;
            --border: rgba(255,255,255,0.06);
            --border2:rgba(255,255,255,0.12);
            --white:  #ffffff;
            --gray:   #777;
            --gray2:  #aaa;
            --gold:   #c9a84c;
            --gold2:  #e8c97a;
            --font-h: 'Bebas Neue', sans-serif;
            --font-b: 'Barlow', sans-serif;
            --radius: 10px;
            --trans:  .3s cubic-bezier(.4,0,.2,1);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--black);
            color: var(--white);
            font-family: var(--font-b);
            font-weight: 300;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Header ─────────────────────────────── */
        header {
            position: sticky; top: 0; z-index: 200;
            height: 64px; padding: 0 5%;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(8,8,8,.88);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-family: var(--font-h);
            font-size: 1.15rem; letter-spacing: 4px;
            color: var(--white); text-decoration: none;
            display: flex; align-items: center; gap: 10px;
        }
        .logo-icon {
            width: 30px; height: 30px;
            background: var(--red); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: .9rem;
        }
        .logo em { color: var(--gold2); font-style: normal; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .header-right a {
            font-size: .68rem; letter-spacing: 2.5px; text-transform: uppercase;
            color: var(--gray); text-decoration: none; transition: color var(--trans);
        }
        .header-right a:hover { color: var(--white); }
        .btn-back {
            background: transparent; border: 1px solid var(--border2);
            color: var(--white) !important; padding: 7px 16px; border-radius: 6px;
            transition: border-color var(--trans), background var(--trans);
        }
        .btn-back:hover { border-color: var(--red) !important; background: rgba(227,28,37,.08) !important; }

        /* ── Hero ───────────────────────────────── */
        .hero {
            position: relative; padding: 100px 5% 80px;
            text-align: center; overflow: hidden;
        }
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 70% 55% at 50% -10%, rgba(227,28,37,.15) 0%, transparent 65%),
                radial-gradient(ellipse 35% 25% at 80% 80%, rgba(201,168,76,.07) 0%, transparent 60%);
            pointer-events: none;
        }
        .hero::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201,168,76,.25), transparent);
        }
        .hero-eyebrow {
            display: inline-flex; align-items: center; gap: 12px;
            font-size: .63rem; letter-spacing: 5px; color: var(--gold);
            text-transform: uppercase; margin-bottom: 24px; position: relative;
        }
        .hero-eyebrow::before, .hero-eyebrow::after {
            content: ''; width: 28px; height: 1px; background: var(--gold); opacity: .45;
        }
        .hero h1 {
            font-family: var(--font-h);
            font-size: clamp(4rem, 10vw, 8rem);
            letter-spacing: 6px; line-height: .88;
            margin-bottom: 28px; position: relative;
        }
        .hero h1 .sub {
            display: block; color: var(--gold2);
            font-size: clamp(2.2rem, 5.5vw, 4.5rem);
            letter-spacing: 10px;
        }
        .hero-desc {
            font-size: .93rem; font-weight: 300; color: var(--gray2);
            max-width: 500px; margin: 0 auto 48px; line-height: 1.8; position: relative;
        }
        .hero-stats {
            display: flex; justify-content: center; align-items: stretch; gap: 40px;
            position: relative;
        }
        .hero-stat { text-align: center; }
        .hero-stat-num {
            font-family: var(--font-h); font-size: 2.2rem;
            color: var(--white); letter-spacing: 2px; display: block;
        }
        .hero-stat-label { font-size: .62rem; letter-spacing: 2px; color: var(--gray); text-transform: uppercase; }
        .hero-stat-sep { width: 1px; background: var(--border2); align-self: stretch; }

        /* ── Promo banner ───────────────────────── */
        .promo-banner {
            max-width: 1300px; margin: 0 auto 0;
            padding: 0 5%;
        }
        .promo-inner {
            border-radius: var(--radius);
            background: linear-gradient(135deg, rgba(227,28,37,.08) 0%, rgba(0,0,0,0) 60%);
            border: 1px solid rgba(227,28,37,.18);
            padding: 20px 28px;
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px; flex-wrap: wrap;
            margin-top: 48px;
        }
        .promo-text { font-size: .82rem; color: var(--gray2); line-height: 1.6; }
        .promo-text strong { color: var(--white); font-weight: 500; }
        .promo-tag {
            background: var(--red); color: var(--white);
            font-family: var(--font-h); font-size: .95rem; letter-spacing: 2px;
            padding: 7px 18px; border-radius: 4px; white-space: nowrap;
        }

        /* ── Filtros ────────────────────────────── */
        .filters-wrap {
            padding: 40px 5% 0;
            max-width: 1300px; margin: 0 auto;
        }
        .filters-label {
            font-size: .6rem; letter-spacing: 3px; color: var(--gray);
            text-transform: uppercase; margin-bottom: 12px;
        }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn {
            background: var(--card); border: 1px solid var(--border);
            color: var(--gray2); font-family: var(--font-b); font-weight: 500;
            font-size: .67rem; letter-spacing: 2px; text-transform: uppercase;
            padding: 8px 18px; border-radius: 4px; cursor: pointer;
            transition: all var(--trans);
        }
        .filter-btn:hover { border-color: var(--border2); color: var(--white); }
        .filter-btn.active { background: var(--red); border-color: var(--red); color: var(--white); }

        /* ── Grid ───────────────────────────────── */
        .menu-section {
            padding: 32px 5% 100px;
            max-width: 1300px; margin: 0 auto; position: relative;
        }
        .cat-divider {
            grid-column: 1 / -1;
            display: flex; align-items: center; gap: 16px;
            margin: 36px 0 8px;
        }
        .cat-divider:first-child { margin-top: 0; }
        .cat-divider-text {
            font-family: var(--font-h); font-size: 1.05rem;
            letter-spacing: 4px; color: var(--gray2); white-space: nowrap;
        }
        .cat-divider-line { flex: 1; height: 1px; background: var(--border); }
        .cat-count {
            font-size: .62rem; letter-spacing: 2px; color: var(--gray);
            font-family: var(--font-b); white-space: nowrap;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
            gap: 16px;
        }
        .menu-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden;
            display: flex; flex-direction: column;
            transition: transform var(--trans), border-color var(--trans), box-shadow var(--trans);
            animation: fadeUp .5s ease both;
        }
        .menu-card:hover {
            transform: translateY(-5px);
            border-color: rgba(201,168,76,.2);
            box-shadow: 0 20px 50px rgba(0,0,0,.5);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .card-img-wrap {
            position: relative; height: 200px; overflow: hidden;
            background: var(--card2);
        }
        .card-img {
            width: 100%; height: 100%; object-fit: cover;
            display: block; transition: transform .6s var(--trans), filter .4s;
            filter: brightness(.85);
        }
        .menu-card:hover .card-img { transform: scale(1.06); filter: brightness(1); }
        .card-no-img {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem;
            background: linear-gradient(135deg, #1c1c1c 0%, #111 100%);
        }
        .card-badge {
            position: absolute; top: 10px; left: 10px;
            background: rgba(8,8,8,.82); backdrop-filter: blur(8px);
            border: 1px solid var(--border2); color: var(--gold2);
            font-size: .58rem; letter-spacing: 2px; text-transform: uppercase;
            padding: 4px 10px; border-radius: 3px;
            font-family: var(--font-b); font-weight: 500;
        }
        .card-body {
            padding: 18px 20px 20px;
            display: flex; flex-direction: column; flex: 1;
        }
        .card-name {
            font-family: var(--font-h); font-size: 1.35rem;
            letter-spacing: 1.5px; margin-bottom: 8px; line-height: 1;
        }
        .card-desc {
            font-size: .8rem; color: var(--gray); line-height: 1.65;
            margin-bottom: 16px; flex: 1;
        }
        .card-footer {
            display: flex; align-items: center;
            justify-content: space-between; gap: 12px;
        }
        .card-price {
            font-family: var(--font-h); font-size: 1.75rem;
            letter-spacing: 1px; color: var(--white); line-height: 1;
        }
        .card-price small {
            font-family: var(--font-b); font-size: .62rem;
            color: var(--gray); letter-spacing: 1px; margin-left: 3px; font-weight: 400;
        }
        .card-btn {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--red); color: var(--white);
            font-family: var(--font-b); font-weight: 600;
            font-size: .63rem; letter-spacing: 2px; text-transform: uppercase;
            text-decoration: none; padding: 9px 14px; border-radius: 5px;
            transition: background var(--trans), transform var(--trans);
            white-space: nowrap;
        }
        .card-btn:hover { background: var(--red2); transform: scale(1.04); }

        /* ── Estado vacío ───────────────────────── */
        .state-msg { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: var(--gray); }
        .state-msg .emoji { font-size: 3rem; display: block; margin-bottom: 16px; }
        .state-msg p { font-size: .85rem; letter-spacing: 1px; }
        .skeleton {
            border-radius: var(--radius);
            background: linear-gradient(90deg, #141414 25%, #1c1c1c 50%, #141414 75%);
            background-size: 200% 100%;
            animation: skel 1.5s infinite;
        }
        @keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .skeleton-card { height: 350px; }

        /* ── Footer ─────────────────────────────── */
        footer {
            border-top: 1px solid var(--border); padding: 28px 5%;
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 12px;
        }
        .footer-brand { font-family: var(--font-h); font-size: .95rem; letter-spacing: 3px; color: var(--gray); }
        .footer-brand span { color: var(--red); }
        .footer-links { display: flex; gap: 20px; }
        .footer-links a {
            font-size: .63rem; letter-spacing: 2px; text-transform: uppercase;
            color: var(--gray); text-decoration: none; transition: color var(--trans);
        }
        .footer-links a:hover { color: var(--white); }

        /* ── Responsive ─────────────────────────── */
        @media (max-width: 768px) {
            .hero-stats { gap: 24px; }
            .promo-inner { flex-direction: column; text-align: center; }
        }
        @media (max-width: 600px) {
            .header-right a:not(.btn-back) { display: none; }
            .menu-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .hero { padding: 70px 5% 60px; }
        }
        @media (max-width: 400px) { .menu-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <a href="/" class="logo">
        <div class="logo-icon">☕</div>
        CAFÉ <em>BDG</em>
    </a>
    <nav class="header-right">
        <a href="/#precios">Planes</a>
        <a href="/#contacto">Contacto</a>
        <a href="/" class="btn-back">← Volver al Gym</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-eyebrow">Black Diamond Gym · Cafetería</div>
    <h1>ENERGÍA<span class="sub">& NUTRICIÓN</span></h1>
    <p class="hero-desc">Recarga antes o después de entrenar. Bebidas, snacks y suplementos para el campeón que hay en ti.</p>
    <div class="hero-stats">
        <div class="hero-stat">
            <span class="hero-stat-num" id="statProductos">—</span>
            <span class="hero-stat-label">Productos</span>
        </div>
        <div class="hero-stat-sep"></div>
        <div class="hero-stat">
            <span class="hero-stat-num" id="statCategorias">—</span>
            <span class="hero-stat-label">Categorías</span>
        </div>
        <div class="hero-stat-sep"></div>
        <div class="hero-stat">
            <span class="hero-stat-num">100%</span>
            <span class="hero-stat-label">Calidad</span>
        </div>
    </div>
</section>
<!--
<div class="promo-banner">
    <div class="promo-inner">
        <p class="promo-text"><strong>¿Eres miembro activo?</strong><br>Obtén beneficios exclusivos en la cafetería.</p>
        <span class="promo-tag">MIEMBROS BDG</span>
    </div>
</div>
-->
<div class="filters-wrap">
    <p class="filters-label">Filtrar por categoría</p>
    <div class="filters" id="filters">
        <button class="filter-btn active" data-cat="all">Todos</button>
    </div>
</div>

<section class="menu-section">
    <div class="menu-grid" id="menuGrid">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
    </div>
</section>

<footer>
    <div class="footer-brand">BLACK <span>DIAMOND</span> GYM</div>
    <nav class="footer-links">
        <a href="/">Inicio</a>
        <a href="/#precios">Planes</a>
        <a href="/#contacto">Contacto</a>
    </nav>
</footer>

<script>
const API = window.location.origin;
let todosLosProductos = [];

const CAT_ICONS = {
    Bebidas:'🥤', Batidos:'🥛', Snacks:'🍌',
    Suplementos:'💊', Comidas:'🍱', Proteínas:'💪', Otros:'☕'
};

function formatCOP(n) {
    return n > 0 ? '$' + Number(n).toLocaleString('es-CO') : 'CONSULTAR';
}

function renderGrid(productos) {
    const grid = document.getElementById('menuGrid');
    if (!productos.length) {
        grid.innerHTML = `<div class="state-msg"><span class="emoji">☕</span><p>No hay productos en esta categoría.</p></div>`;
        return;
    }

    // Agrupar por categoría sin repetir
    const grupos = {};
    productos.forEach(p => {
        const cat = p.categoria || 'Otros';
        if (!grupos[cat]) grupos[cat] = [];
        grupos[cat].push(p);
    });

    let html = '';
    Object.entries(grupos).forEach(([cat, items]) => {
        const icono = CAT_ICONS[cat] || '☕';
        html += `
        <div class="cat-divider">
            <span class="cat-divider-text">${icono} ${cat.toUpperCase()}</span>
            <div class="cat-divider-line"></div>
            <span class="cat-count">${items.length} producto${items.length !== 1 ? 's' : ''}</span>
        </div>`;
        items.forEach((p, i) => {
            html += `
            <div class="menu-card" style="animation-delay:${(i * 0.07).toFixed(2)}s">
                <div class="card-img-wrap">
                    ${p.imagen_url
                        ? `<img class="card-img" src="${p.imagen_url}" alt="${p.nombre}" loading="lazy">`
                        : `<div class="card-no-img">${icono}</div>`}
                    ${p.categoria ? `<span class="card-badge">${p.categoria}</span>` : ''}
                </div>
                <div class="card-body">
                    <div class="card-name">${p.nombre}</div>
                    ${p.descripcion ? `<p class="card-desc">${p.descripcion}</p>` : '<p class="card-desc" style="flex:1"></p>'}
                    <div class="card-footer">
                        <div class="card-price">${formatCOP(p.precio)}${p.precio > 0 ? '<small>COP</small>' : ''}</div>
                        <a href="https://wa.me/${window._waNumber||'573133737590'}?text=Hola,%20quisiera%20pedir:%20${encodeURIComponent(p.nombre)}" target="_blank" class="card-btn">Pedir ↗</a>
                    </div>
                </div>
            </div>`;
        });
    });

    grid.innerHTML = html;
}

function buildFilters(productos) {
    const cats = [...new Set(productos.map(p => p.categoria).filter(Boolean))];
    const filtersEl = document.getElementById('filters');
    cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.cat = cat;
        btn.textContent = (CAT_ICONS[cat] ? CAT_ICONS[cat] + ' ' : '') + cat;
        filtersEl.appendChild(btn);
    });
    filtersEl.addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.dataset.cat;
        renderGrid(cat === 'all' ? todosLosProductos : todosLosProductos.filter(p => p.categoria === cat));
    });
}

async function cargarMenu() {
    try {
        const r = await fetch(`${API}/api/cafeteria`);
        if (!r.ok) throw new Error('Error');
        todosLosProductos = await r.json();
        const cats = new Set(todosLosProductos.map(p => p.categoria).filter(Boolean));
        document.getElementById('statProductos').textContent  = todosLosProductos.length;
        document.getElementById('statCategorias').textContent = cats.size;
        buildFilters(todosLosProductos);
        renderGrid(todosLosProductos);
    } catch(e) {
        document.getElementById('menuGrid').innerHTML =
            `<div class="state-msg"><span class="emoji">⚠️</span><p>No se pudo cargar el menú. Intenta más tarde.</p></div>`;
    }
}

cargarMenu();
</script>
</body>
</html>
