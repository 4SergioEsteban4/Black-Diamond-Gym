<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería · Black Diamond Gym</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --red:    #e31c25;
            --red2:   #c0111a;
            --black:  #0a0a0a;
            --dark:   #111111;
            --card:   #161616;
            --border: rgba(255,255,255,0.07);
            --white:  #ffffff;
            --gray:   #888;
            --gold:   #e8c97a;
            --font-h: 'Bebas Neue', sans-serif;
            --font-b: 'DM Sans', sans-serif;
            --radius: 12px;
            --trans:  .25s ease;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--black);
            color: var(--white);
            font-family: var(--font-b);
            font-weight: 300;
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10,10,10,.92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            padding: 0 5%;
            display: flex; align-items: center; justify-content: space-between;
            height: 68px;
        }
        .header-logo {
            font-family: var(--font-h);
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: var(--white);
            text-decoration: none;
            display: flex; align-items: center; gap: 10px;
        }
        .header-logo span { color: var(--red); }
        .header-nav { display: flex; gap: 24px; align-items: center; }
        .header-nav a {
            font-size: .75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gray);
            text-decoration: none;
            transition: color var(--trans);
        }
        .header-nav a:hover { color: var(--white); }
        .header-nav .btn-back {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--white);
            padding: 8px 18px;
            border-radius: 6px;
            font-size: .72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            transition: border-color var(--trans), background var(--trans);
        }
        .header-nav .btn-back:hover { border-color: var(--red); background: rgba(227,28,37,.08); }

        /* ── Hero cafetería ── */
        .cafe-hero {
            padding: 80px 5% 60px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .cafe-hero::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(227,28,37,.12) 0%, transparent 70%);
            pointer-events: none;
        }
        .cafe-eyebrow {
            font-size: .7rem;
            letter-spacing: 4px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 16px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .cafe-eyebrow::before, .cafe-eyebrow::after {
            content: '';
            width: 40px; height: 1px;
            background: var(--gold);
            opacity: .4;
        }
        .cafe-hero h1 {
            font-family: var(--font-h);
            font-size: clamp(3.5rem, 8vw, 7rem);
            letter-spacing: 4px;
            line-height: .9;
            margin-bottom: 20px;
        }
        .cafe-hero h1 span { color: var(--gold); }
        .cafe-hero p {
            font-size: .9rem;
            color: var(--gray);
            max-width: 480px;
            margin: 0 auto 40px;
            line-height: 1.7;
        }

        /* ── Filtros ── */
        .filters {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 56px;
        }
        .filter-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--gray);
            font-family: var(--font-b);
            font-size: .72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 9px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all var(--trans);
        }
        .filter-btn:hover { border-color: rgba(255,255,255,.2); color: var(--white); }
        .filter-btn.active {
            background: var(--red);
            border-color: var(--red);
            color: var(--white);
        }

        /* ── Grid menú ── */
        .menu-section { padding: 0 5% 80px; max-width: 1300px; margin: 0 auto; }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .menu-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: transform var(--trans), border-color var(--trans), box-shadow var(--trans);
            animation: fadeUp .4s ease both;
        }
        .menu-card:hover {
            transform: translateY(-4px);
            border-color: rgba(232,201,122,.25);
            box-shadow: 0 12px 40px rgba(0,0,0,.4);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .card-img {
            width: 100%; height: 200px;
            object-fit: cover;
            display: block;
            filter: brightness(.9);
            transition: filter var(--trans);
        }
        .menu-card:hover .card-img { filter: brightness(1); }
        .card-no-img {
            width: 100%; height: 200px;
            background: linear-gradient(135deg, #1a1a1a, #0f0f0f);
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem;
        }
        .card-body { padding: 18px 20px 20px; }
        .card-cat {
            font-size: .65rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 6px;
        }
        .card-name {
            font-family: var(--font-h);
            font-size: 1.35rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
            line-height: 1.1;
        }
        .card-desc {
            font-size: .8rem;
            color: var(--gray);
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .card-price {
            font-family: var(--font-h);
            font-size: 1.7rem;
            color: var(--white);
            letter-spacing: 1px;
        }
        .card-price span {
            font-family: var(--font-b);
            font-size: .72rem;
            color: var(--gray);
            letter-spacing: 1px;
            margin-left: 4px;
        }

        /* ── Estado vacío / carga ── */
        .state-msg {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
            font-size: .85rem;
            letter-spacing: 1px;
        }
        .state-msg .emoji { font-size: 2.5rem; display: block; margin-bottom: 14px; }

        /* ── Skeleton ── */
        .skeleton {
            background: linear-gradient(90deg, #1a1a1a 25%, #222 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: skel 1.4s infinite;
            border-radius: var(--radius);
        }
        @keyframes skel {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-card { height: 340px; }

        /* ── Footer ── */
        footer {
            border-top: 1px solid var(--border);
            padding: 28px 5%;
            text-align: center;
            font-size: .72rem;
            letter-spacing: 2px;
            color: var(--gray);
            text-transform: uppercase;
        }
        footer a { color: var(--red); text-decoration: none; }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .header-nav a:not(.btn-back) { display: none; }
            .menu-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .cafe-hero { padding: 60px 5% 40px; }
        }
        @media (max-width: 400px) {
            .menu-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <a href="/" class="header-logo">☕ CAFÉ <span>BDG</span></a>
    <nav class="header-nav">
        <a href="/#precios">Planes</a>
        <a href="/#contacto">Contacto</a>
        <a href="/" class="btn-back">← Volver al Gym</a>
    </nav>
</header>

<section class="cafe-hero">
    <div class="cafe-eyebrow">Black Diamond Gym</div>
    <h1>CAFÉ <span>&</span><br>NUTRICIÓN</h1>
    <p>Recarga energías antes o después de tu entrenamiento. Productos frescos, snacks saludables y bebidas para el campeón que hay en ti.</p>
</section>

<div class="filters" id="filters">
    <button class="filter-btn active" data-cat="all">Todos</button>
</div>

<section class="menu-section">
    <div class="menu-grid" id="menuGrid">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
    </div>
</section>

<footer>
    <p><a href="/">Black Diamond Gym</a> · Boxing Center · Bosa, Bogotá &nbsp;|&nbsp; Precios en COP</p>
</footer>

<script>
const API = window.location.origin;
let todosLosProductos = [];

function formatCOP(n) {
    return '$' + Number(n).toLocaleString('es-CO');
}

function renderGrid(productos) {
    const grid = document.getElementById('menuGrid');
    if (!productos.length) {
        grid.innerHTML = `<div class="state-msg"><span class="emoji">☕</span>No hay productos disponibles en esta categoría.</div>`;
        return;
    }
    grid.innerHTML = productos.map((p, i) => `
        <div class="menu-card" style="animation-delay:${(i * 0.06).toFixed(2)}s">
            ${p.imagen_url
                ? `<img class="card-img" src="${p.imagen_url}" alt="${p.nombre}" loading="lazy">`
                : `<div class="card-no-img">☕</div>`}
            <div class="card-body">
                ${p.categoria ? `<div class="card-cat">${p.categoria}</div>` : ''}
                <div class="card-name">${p.nombre}</div>
                ${p.descripcion ? `<div class="card-desc">${p.descripcion}</div>` : ''}
                <div class="card-price">${formatCOP(p.precio)}<span>COP</span></div>
            </div>
        </div>`).join('');
}

function buildFilters(productos) {
    const cats = [...new Set(productos.map(p => p.categoria).filter(Boolean))];
    const filtersEl = document.getElementById('filters');
    cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.cat = cat;
        btn.textContent = cat;
        filtersEl.appendChild(btn);
    });
    filtersEl.addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.dataset.cat;
        const filtrados = cat === 'all' ? todosLosProductos : todosLosProductos.filter(p => p.categoria === cat);
        renderGrid(filtrados);
    });
}

async function cargarMenu() {
    try {
        const r = await fetch(`${API}/api/cafeteria`);
        if (!r.ok) throw new Error('Sin datos');
        todosLosProductos = await r.json();
        buildFilters(todosLosProductos);
        renderGrid(todosLosProductos);
    } catch(e) {
        document.getElementById('menuGrid').innerHTML =
            `<div class="state-msg"><span class="emoji">⚠️</span>No se pudo cargar el menú. Intenta más tarde.</div>`;
    }
}

cargarMenu();
</script>
</body>
</html>
